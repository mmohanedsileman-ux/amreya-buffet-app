        fill="none" stroke="#ba8e54" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Monogram Group (A & C) -->
  <g id="brand-monogram">
    <!-- Letter A main navy shape -->
    <path d="M 140 270 L 195 270 L 209 238 L 243 238 L 243 270 L 288 270 L 265 174 L 253 135 L 210 135 L 140 270 Z M 218 214 L 235 172 L 239 214 Z" 
          fill="#122749" />

    <!-- Letter C main navy shape -->
    <path d="M 285 135 L 355 135 L 355 170 L 316 170 C 326 179 332 192 332 208 C 332 225 324 238 312 245 L 355 245 L 355 270 L 285 270 C 274 270 265 264 262 254 L 280 238 C 285 241 292 243 300 243 C 314 243 322 232 322 212 C 322 192 312 180 296 180 C 288 180 282 183 277 188 L 262 170 C 267 154 275 142 285 135 Z" 
          fill="#122749" />

    <!-- Connecting base line / fill -->
    <rect x="190" y="247" width="98" height="23" fill="#122749" />

    <!-- Golden Roasted Coffee Bean -->
    <g transform="translate(262, 238) rotate(-22)">
      <ellipse cx="0" cy="0" rx="16" ry="11" fill="#b1824a" />
      <path d="M -15 0 Q -5 4 0 0 Q 5 -4 15 0 Q 5 -1 0 1 Q -5 3 -15 0 Z" fill="#122749" opacity="0.85" />
    </g>

    <!-- White Silhouette Fork & Spoon on the A/C junction -->
    <g fill="#ffffff">
      <!-- Fork on left -->
      <path d="M 243 218 L 246 218 L 247 206 L 253 206 L 254 218 L 257 218 L 255 195 L 253 195 L 252 202 L 251 195 L 249 195 L 248 202 L 247 195 L 245 195 Z" />
      <!-- Spoon on right -->
      <ellipse cx="266" cy="199" rx="6.5" ry="9" />
      <path d="M 264 207 L 268 207 L 267 220 L 265 220 Z" />
    </g>

    <!-- Rising Steam Curves (Navy) -->
    <g fill="none" stroke="#122749" stroke-width="2.8" stroke-linecap="round">
      <path d="M 255 178 C 251 168 259 158 253 146 C 250 140 252 133 256 124" />
      <path d="M 262 176 C 267 167 261 157 266 146 C 269 139 267 131 262 122" />
    </g>
  </g>

  <!-- AMREYAH BUFFET Text (Bold Navy Sans) -->
  <text x="250" y="323" 
        text-anchor="middle" 
        fill="#122749" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-size="28.5" 
        font-weight="900" 
        letter-spacing="2.8">AMREYAH BUFFET</text>

  <!-- بوفية العامرية Arabic Text (Bold Calligraphic) -->
  <text x="250" y="375" 
        text-anchor="middle" 
        fill="#122749" 
        font-family="'Cairo', 'Almarai', 'Tajawal', 'Segoe UI', Tahoma, sans-serif" 
        font-size="40" 
        font-weight="900" 
        letter-spacing="0.5">بوفية العامرية</text>
</svg>
